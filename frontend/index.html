<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Document Desk</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f4f2ec;color:#17211f}main{max-width:1100px;margin:auto;padding:48px 24px}.auth{min-height:100vh;display:grid;grid-template-columns:1fr 360px;gap:80px;align-items:center;max-width:1200px}.card{background:#fffdf8;border:1px solid #d9ddd4;padding:32px}h1{font-size:clamp(2.5rem,6vw,5rem);margin:0 0 24px}h2,p{margin:0}.muted,small{color:#68736e}.eyebrow{color:#1f6d68;font-size:12px;font-weight:bold;letter-spacing:2px}input{display:block;width:100%;box-sizing:border-box;padding:12px;margin:14px 0;border:1px solid #d9ddd4}button{padding:13px 18px;background:#1f6d68;color:white;border:0;font-weight:bold;cursor:pointer;margin-top:14px}.outline{background:transparent;color:#1f6d68;border:1px solid #1f6d68}.message{color:#1f6d68}.card small{display:block;color:#68736e;font-size:.8rem;margin-top:18px}.header{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid #d9ddd4;margin-bottom:32px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.drop{display:block;border:1px dashed #9daaa2;padding:40px 16px;text-align:center;color:#68736e;cursor:pointer;margin-top:24px}.drop input{display:none}.heading,li{display:flex;justify-content:space-between;gap:18px}ul{list-style:none;padding:0}li{border-top:1px solid #d9ddd4;padding:16px 0}li small,li b{display:block}em{color:#387443;font-style:normal;text-transform:uppercase;font-size:12px}@media(max-width:700px){.auth,.grid{grid-template-columns:1fr}.auth{gap:32px}.header{align-items:start}}</style></head><body><div id="root"></div><script type="module" src="/src/app.jsx"></script></body></html>
